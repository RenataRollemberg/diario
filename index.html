<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Diário</title>
<meta name="description" content="Um diário infantil no seu quarto: conte como foi o seu dia, escolha uma carinha e guarde suas lembranças.">
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Diário">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b3a5a;
  --ink-soft:#56648a;
  --sky:#8fd3ff;
  --grass:#7fcf6b;
  --paper:#f3f9ff;
  --card:#ffffff;
  --line:#d3e3f5;
  --coral:#d9432f;
  --coral-soft:#ffe2dc;
  --sun:#ffd43b;
  --mint:#dff6e3;
  --radius:20px;
  --display:'Baloo 2','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:#dff4ff;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #5c7cfa;outline-offset:2px}

#app{position:relative;height:100%;overflow:hidden;background:linear-gradient(#ffe3cc 0 62%,#e8b980 62%)}

/* ---------- Quarto ---------- */
#park{position:absolute;inset:0}
#parkSvg{width:100%;height:100%;display:block;overflow:visible}
.hot{cursor:pointer;outline:none}
.hot .lift{transition:transform .18s ease;transform-box:fill-box;transform-origin:center bottom}
.hot:hover .lift,.hot:focus-visible .lift{transform:scale(1.06)}
.hot:focus-visible .pill rect{stroke:#5c7cfa;stroke-width:4}
.pill text{font-family:var(--display);font-weight:700;font-size:15px;fill:#fff;text-anchor:middle}
.pill rect{fill:var(--ink)}
.cloud{animation:drift 60s linear infinite alternate}
.cloud.b{animation-duration:80s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
.sway{animation:sway 3.2s ease-in-out infinite alternate;transform-box:view-box}
@keyframes sway{from{transform:rotate(7deg)}to{transform:rotate(-7deg)}}
@media (prefers-reduced-motion:reduce){.cloud,.sway{animation:none}.hot .lift{transition:none}}

/* cores do quarto (a criança escolhe) */
#park{--wall:#ffe3cc;--wall-dot:#ffcfa8;--bed:#4dabf7;--rug:#ffc9de;--floor:#e8b980;--floor-line:#c98e55}
.c-wall{fill:var(--wall);transition:fill .4s}.c-wdot{fill:var(--wall-dot);transition:fill .4s}
.c-bed{fill:var(--bed);transition:fill .4s}.c-rug{fill:var(--rug);transition:fill .4s}
.c-floor{fill:var(--floor);transition:fill .4s}.c-fline{stroke:var(--floor-line)}
.sky{fill:url(#skyg)}
.sunG,.moonG,.starsG,.dim,.glow,.cloud{transition:opacity .6s}
.moonG,.starsG{opacity:0}.dim,.glow{opacity:0;pointer-events:none}
#park.night .sky{fill:#1f2a5c}
#park.night .sunG,#park.night .cloud{opacity:0}
#park.night .moonG,#park.night .starsG{opacity:1}
#park.night .dim{opacity:.36}
#park.night .glow{opacity:1}
#park.night .top h1,#park.night .top p{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.curtain{animation:flutter 4s ease-in-out infinite alternate;transform-box:view-box}
.curtain.b{animation-duration:4.6s}
@keyframes flutter{from{transform:rotate(1.2deg)}to{transform:rotate(-1.2deg)}}
.ball{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center bottom}
.ball.bounce{animation:ballb .9s cubic-bezier(.3,.6,.4,1)}
@keyframes ballb{20%{transform:translate(18px,-60px) rotate(120deg)}45%{transform:translate(36px,0) rotate(240deg) scale(1.1,.85)}65%{transform:translate(48px,-22px) rotate(320deg)}85%{transform:translate(24px,0) rotate(360deg)}}
.ball:focus-visible{outline:3px solid #5c7cfa}
@media (prefers-reduced-motion:reduce){.curtain,.ball.bounce{animation:none}}

.topbtns{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
.decobtn{border:0;border-radius:999px;background:#fff;box-shadow:0 3px 0 rgba(43,58,90,.18);display:flex;flex-direction:column;align-items:center;padding:6px 8px 4px;font-weight:800;font-size:.78rem;min-width:62px;min-height:56px;gap:1px}
#app.decorating .top{display:none}
#app.decorating #parkSvg{height:46%}
#decor{position:absolute;left:0;right:0;bottom:0;height:54%;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 0 rgba(43,58,90,.1),0 -14px 30px rgba(43,58,90,.15);display:flex;flex-direction:column;z-index:4}
#decor[hidden]{display:none}
#decor .dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;border-bottom:2px solid var(--line)}
#decor .dhead h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.4rem}
#decor .dbody{overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 20px);overscroll-behavior:contain}
#decor h3{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:14px 0 8px}
#decor h3 small{font-family:var(--body);font-size:.85rem;color:var(--ink-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:50px;height:50px;border-radius:14px;border:3px solid var(--line);background:linear-gradient(135deg,var(--c) 0 60%,var(--d) 60%);box-shadow:0 3px 0 var(--line);padding:0}
.sw.round{border-radius:50%;background:var(--c)}
.sw[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px #fff6c9,0 4px 0 var(--ink);transform:scale(1.08)}
.chip.pat .pv{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background-color:var(--c)}
.pat-bolinhas .pv{background-image:radial-gradient(var(--d) 2.5px,transparent 3px);background-size:8px 8px}
.pat-estrelas .pv{background-image:radial-gradient(var(--d) 3.5px,transparent 4px);background-size:12px 12px}
.pat-listras .pv{background-image:repeating-linear-gradient(90deg,var(--d) 0 4px,transparent 4px 8px)}
.pat-coracoes .pv{background-image:radial-gradient(circle at 30% 40%,var(--d) 2.5px,transparent 3px),radial-gradient(circle at 70% 40%,var(--d) 2.5px,transparent 3px);background-size:11px 11px}
.char.mini{padding:4px 2px;font-size:.8rem}

.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.top h1{margin:0;font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.1;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.7)}
.top p{margin:0;font-weight:700;color:var(--ink);opacity:.85}
.gear{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 rgba(43,58,90,.18);display:grid;place-items:center}

/* ---------- Painéis ---------- */
#sheet{position:absolute;inset:0;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
.bar{position:sticky;top:0;z-index:2;background:var(--paper);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--line)}
.bar h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1}
.back{border:0;background:var(--sky);color:var(--ink);font-weight:800;border-radius:999px;min-height:48px;padding:0 18px 0 14px;display:flex;align-items:center;gap:6px;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 48px)}
.wrap h3{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:22px 0 10px}
.wrap h3:first-child{margin-top:0}
.hint{color:var(--ink-soft);font-size:.95rem;margin:4px 0 0}

.btn{border:0;border-radius:999px;min-height:56px;padding:0 26px;font-family:var(--display);font-weight:700;font-size:1.2rem;background:var(--coral);color:#fff;box-shadow:0 4px 0 #9d2b1c;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9d2b1c}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.green{background:#1f8a4c;box-shadow:0 4px 0 #14653a}
.btn.small{min-height:44px;font-size:1rem;padding:0 18px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn[disabled]{opacity:.45;pointer-events:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

textarea,input[type=text],input[type=date],input[type=tel],input[type=number],select{width:100%;border:3px solid var(--line);border-radius:16px;background:#fff;padding:12px 14px;min-height:52px}
textarea{min-height:170px;resize:vertical;line-height:1.5}
label.f{display:block;font-weight:800;margin:14px 0 6px}

.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.moods{grid-template-columns:repeat(6,1fr)}}
.mood{border:3px solid var(--line);background:#fff;border-radius:var(--radius);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.95rem}
.mood[aria-pressed=true]{border-color:var(--ink);background:#fff6c9;box-shadow:0 4px 0 var(--ink)}

.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.chars{grid-template-columns:repeat(6,1fr)}}
.char{border:3px solid var(--line);background:#fff;border-radius:var(--radius);padding:6px 4px;font-weight:800;font-size:.9rem;display:flex;flex-direction:column;align-items:center}
.char[aria-pressed=true]{border-color:var(--ink);background:var(--mint);box-shadow:0 4px 0 var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--line);background:#fff;border-radius:999px;min-height:46px;padding:0 16px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{border-color:var(--ink);background:#fff6c9}
.chip .x{opacity:.6}

.mic{display:flex;align-items:center;gap:12px;margin-top:10px}
.micbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #9d2b1c;flex:none}
.micbtn[aria-pressed=true]{background:#1f8a4c;box-shadow:0 4px 0 #14653a;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.micbtn[aria-pressed=true]{animation:none}}

.card{background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.list{display:grid;gap:12px}
.row{border:3px solid var(--line);background:#fff;border-radius:var(--radius);padding:10px 14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.row .meta{min-width:0;flex:1}
.row .d{font-weight:800}
.row .s{color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row[aria-pressed=true]{border-color:var(--ink);background:#fff6c9;box-shadow:0 4px 0 var(--ink)}
.tag{display:inline-block;font-size:.78rem;font-weight:800;background:#e8eefb;color:var(--ink-soft);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle}
.tag.warn{background:var(--coral-soft);color:#8f2a1b}
.empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-weight:700}
.dayhead{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.dayhead h3{margin:0}
.diarytext{white-space:pre-wrap;font-size:1.2rem;line-height:1.6;background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline>*{flex:1 1 180px}
.inline>.btn{flex:0 0 auto}
.linkbtn{background:none;border:0;color:var(--ink-soft);text-decoration:underline;font-weight:700;padding:10px 4px;min-height:44px}

.welcome{min-height:100%;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background:linear-gradient(#ffe3cc 0 60%,#e8b980 60%)}
.welcome h1{margin:0;font-family:var(--display);font-weight:800;font-size:2.8rem;line-height:1.05;text-shadow:0 3px 0 rgba(255,255,255,.7)}
.welcome .crew{display:flex;gap:6px;align-items:flex-end;justify-content:center;margin:6px 0 10px}
.welcome .box{background:#fff;border:3px solid var(--line);border-radius:28px;padding:20px 20px 22px;width:min(100%,420px);box-shadow:0 6px 0 rgba(43,58,90,.14)}
.welcome .box label{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;margin-bottom:10px}
.welcome .box input{text-align:center;font-size:1.4rem;font-weight:800}
.welcome .box .btn{width:100%;margin-top:16px}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;font-weight:800;border-radius:999px;padding:12px 22px;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Calendário de humores ---------- */
.cal{background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:10px 10px 12px}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.calnav strong{font-family:var(--display);font-size:1.25rem}
.calnav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--sky);display:grid;place-items:center;font-weight:800}
.calnav button[disabled]{opacity:.35;pointer-events:none}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .wd{font-size:.8rem;font-weight:800;color:var(--ink-soft);padding:2px 0}
.cday{aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:#f5f9ff;display:grid;place-items:center;font-weight:800;font-size:.9rem;padding:0;min-width:0;position:relative}
.cday svg{width:82%;height:82%}
.cday.today{border-color:var(--coral)}
.cday[aria-pressed=true]{border-color:var(--ink);background:#fff6c9}
.cday.future{opacity:.35;pointer-events:none}
.cday .n{position:absolute;right:2px;bottom:0;font-size:.62rem;color:var(--ink-soft)}
.streak{margin:10px 2px 0;font-weight:800;color:var(--ink-soft)}
.draftnote{background:#fff6c9;border:2px dashed #d9a441;border-radius:14px;padding:8px 12px;font-weight:700;margin:0 0 10px}

/* ---------- Visual para crianças: cores por tela ---------- */
#sheet{--th:#4dabf7;--th-bg:#e3f3ff;--th-dot:rgba(77,171,247,.14)}
#sheet[data-theme=sun]{--th:#ff9f1c;--th-bg:#fff3d9;--th-dot:rgba(255,159,28,.16)}
#sheet[data-theme=grape]{--th:#9775fa;--th-bg:#f1ebff;--th-dot:rgba(151,117,250,.15)}
#sheet[data-theme=sky]{--th:#339af0;--th-bg:#e3f3ff;--th-dot:rgba(51,154,240,.14)}
#sheet[data-theme=lemon]{--th:#f2b705;--th-bg:#fffbe0;--th-dot:rgba(242,183,5,.18)}
#sheet[data-theme=slate]{--th:#748ffc;--th-bg:#eef1fb;--th-dot:rgba(116,143,252,.14)}
#sheet[data-theme=mint]{--th:#20c997;--th-bg:#e3faf2;--th-dot:rgba(32,201,151,.15)}
#sheet{background-color:var(--th-bg);background-image:radial-gradient(var(--th-dot) 2.5px,transparent 3px);background-size:26px 26px}
#sheet .bar{background:var(--th);border-bottom:0;border-radius:0 0 26px 26px;box-shadow:0 5px 0 rgba(43,58,90,.12);padding-bottom:12px;margin-bottom:6px}
#sheet .bar h2{color:#fff;text-shadow:0 2px 0 rgba(43,58,90,.25);flex:1;min-width:0}
#sheet .bar .back{background:#fff;box-shadow:0 3px 0 rgba(43,58,90,.2)}
.mascot{flex:none;margin:-6px -2px -14px 0;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}

.step{display:flex;align-items:center;gap:10px}
.step .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--th);color:#fff;display:grid;place-items:center;font-size:1.15rem;box-shadow:0 3px 0 rgba(43,58,90,.2)}
.wrap h3{font-size:1.35rem}

.buddy{display:flex;align-items:flex-end;gap:6px;margin:4px 0 6px}
.buddy>span{flex:none;animation:bob 2.6s ease-in-out infinite}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;margin:0 0 30px;font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.2}
.bubble::before{content:"";position:absolute;left:-13px;bottom:12px;border:10px solid transparent;border-right-color:var(--ink)}
.bubble::after{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:#fff}
.bubble.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.08)}}

.mood,.char{box-shadow:0 4px 0 var(--line);transition:transform .12s}
.mood:active,.char:active{transform:translateY(3px)}
.mood[aria-pressed=true],.char[aria-pressed=true]{animation:wiggle .45s ease}
.mood[aria-pressed=true] svg{transform:scale(1.08)}
@keyframes wiggle{25%{transform:rotate(-6deg) scale(1.05)}60%{transform:rotate(5deg) scale(1.05)}}

.chip{box-shadow:0 3px 0 var(--line)}
.chip.idea{background:#fff;border-style:dashed;font-size:.95rem;min-height:42px}
.chip.shuffle{width:46px;padding:0;justify-content:center;font-size:1.3rem}

textarea.notebook,.diarytext.notebook{border-color:var(--line);background-color:#fffefa;
  background-image:linear-gradient(90deg,transparent 30px,#ffb3b3 30px,#ffb3b3 32px,transparent 32px),repeating-linear-gradient(transparent 0 calc(1.6em - 2px),#cfe3f7 calc(1.6em - 2px) 1.6em);
  background-attachment:local;line-height:1.6em;padding:8px 14px 8px 42px;font-size:1.2rem}
textarea.notebook{min-height:calc(1.6em * 7 + 16px)}
.diarytext.notebook{padding-top:8px}

.btn{transition:transform .1s}
.btn.big{min-height:64px;font-size:1.35rem;padding:0 30px}
.btn.big svg{flex:none}
.card,.row,.cal,.diarytext{box-shadow:0 5px 0 rgba(43,58,90,.08)}
.tag.vid{background:#ffe3ec;color:#a61e4d}

/* vídeo */
.vidwrap{position:relative;border-radius:22px;overflow:hidden;background:#1d2539;border:3px solid var(--ink)}
.vidwrap video{display:block;width:100%;max-height:62vh;background:#1d2539}
.vidwrap.live video{transform:scaleX(-1)}
.vidwrap.recording{border-color:#e03131;box-shadow:0 0 0 4px rgba(224,49,49,.3)}
.vidwrap .tip{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-weight:800;text-align:center;font-size:.95rem}
.recdot{position:absolute;left:10px;top:10px;background:#e03131;color:#fff;font-weight:800;font-size:.85rem;border-radius:999px;padding:4px 12px 4px 26px}
.recdot::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.recprog{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.3)}
.recprog span{display:block;height:100%;width:0;background:#ffd43b;transition:width .25s linear}
.btn .dot{width:18px;height:18px;border-radius:50%;background:#fff}
.btn .sq{width:16px;height:16px;border-radius:3px;background:#fff}
.btn .rt{font-family:var(--body);font-size:.9rem;opacity:.9}
.bigcam{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:3px dashed var(--th);background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.bigcam .ic{flex:none;width:58px;height:58px;border-radius:50%;background:#e64980;display:grid;place-items:center;box-shadow:0 4px 0 #a61e4d}
.bigcam strong{font-family:var(--display);font-size:1.25rem}
.bigcam small{color:var(--ink-soft);font-weight:700;font-size:.95rem}

/* quarto: estrelas */
.stars{pointer-events:none;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;background:rgba(255,255,255,.88);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800;box-shadow:0 3px 0 rgba(43,58,90,.15)}
.stars:empty{display:none}
.stars b{font-family:var(--display);font-size:1.15rem}
.stars .fire{background:#ff922b;color:#fff;border-radius:999px;padding:0 10px;font-size:.85rem}

/* festa ao guardar */
#sheet[data-theme=party]{background:linear-gradient(#ffe3cc 0 56%,#e8b980 56%)}
.yay{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);gap:4px}
.yay h2{margin:0;font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;color:#fff;text-shadow:0 3px 0 var(--ink),0 6px 0 rgba(43,58,90,.25)}
.yaychar{animation:jump .8s ease-in-out 3}
@keyframes jump{30%{transform:translateY(-34px) rotate(-6deg)}60%{transform:translateY(0) scaleY(.92)}}
.yaysub{margin:6px 0 10px;font-weight:800;font-size:1.15rem;background:#fff;border-radius:999px;padding:6px 16px}
.yaystar{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px 18px;font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.1;text-align:left;box-shadow:0 5px 0 rgba(43,58,90,.12)}
.yaystar svg{animation:spin 1.2s ease-out}
.yaystar small{font-family:var(--body);font-size:.9rem;color:var(--ink-soft)}
@keyframes spin{from{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.25) rotate(10deg)}to{transform:none}}
.yaystreak{margin:12px 0 0;background:#ff922b;color:#fff;font-weight:800;border-radius:999px;padding:6px 16px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.mascot,.buddy>span,.yaychar,.yaystar svg,.mood[aria-pressed=true],.char[aria-pressed=true],.bubble.pop{animation:none}}

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null;
function stopRec(){if(rec){try{rec.onend=null;rec.onerror=null;rec.abort()}catch(e){}rec=null}var m=$('#mic');if(m)m.setAttribute('aria-pressed','false');var lab=$('#micLabel');if(lab)lab.textContent='Toque para falar'}
function voiceErr(code){
  if(code==='not-allowed'||code==='service-not-allowed')return 'O microfone não foi liberado neste aparelho. Peça ajuda para liberar.';
  if(code==='no-speech')return 'Não ouvi nada. Tente de novo!';
  if(code==='network')return 'A voz precisa de internet. Tente de novo mais tarde.';
  return 'A voz não funcionou agora. Você pode escrever!';
}
function dictate(){
  var btn=$('#mic');
  if(!SR){toast('A voz não funciona neste navegador. Você pode escrever!');return}
  if(rec){stopRec();return}
  rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=false;
  rec.onresult=function(ev){
    var ta=$('#txt');if(!ta)return;
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal){
        var t=ev.results[i][0].transcript.trim();
        if(t){ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+(ta.value&&!/[.!?]\s*$/.test(ta.value)?t:cap(t));draft.text=ta.value;keepDraft()}
      }
    }
  };
  rec.onerror=function(ev){stopRec();toast(voiceErr(ev.error))};
  rec.onend=function(){stopRec()};
  try{rec.start();btn.setAttribute('aria-pressed','true');$('#micLabel').textContent='Estou ouvindo... toque para parar'}catch(e){stopRec();toast('A voz não funcionou agora. Você pode escrever!')}
}
function listenRestore(id){
  if(!SR){restore(id);return}
  if(rec){stopRec();return}
  rec=new SR();rec.lang='pt-BR';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=4;
  rec.onresult=function(ev){
    var heard='';
    for(var i=0;i<ev.results.length;i++)for(var j=0;j<ev.results[i].length;j++)heard+=' '+ev.results[i][j].transcript;
    stopRec();
    if(/volt|restaur|traz|recuper|devolv/i.test(heard))restore(id);
    else toast('Não entendi. Diga: voltar');
  };
  rec.onerror=function(ev){stopRec();toast(voiceErr(ev.error))};
  rec.onend=function(){stopRec()};
  try{rec.start();var b=$('#micR');if(b)b.setAttribute('aria-pressed','true');var l=$('#micRLabel');if(l)l.textContent='Estou ouvindo... diga: voltar'}catch(e){stopRec();toast('A voz não funcionou agora.')}
}

var VIEWS={};

var draftRestored=false;
function initDraft(id){
  draftRestored=false;
  var e=id&&id.indexOf('d:')!==0&&entry(id),sv=S.draft,key=null;
  if(id&&id.indexOf('d:')===0){
    draft={id:null,date:id.slice(2),text:'',mood:null,character:null,friends:[]};
  }else if(e){
    draft={id:e.id,date:e.date,text:e.text,mood:e.mood,character:e.character,friends:(e.friends||[]).slice()};
    if(e.hasVideo)key=e.id;
  }else if(sv&&(sv.text||sv.mood||sv.video)){
    draft={id:null,date:sv.date||dstr(),text:sv.text||'',mood:sv.mood||null,character:sv.character||null,friends:(sv.friends||[]).filter(friendName)};
    draftRestored=true;if(sv.video)key='__draft';
  }else{
    draft={id:null,date:dstr(),text:'',mood:null,character:null,friends:[]};
  }
  draft.video=null;draft.videoTouched=false;vidState='idle';
  if(key){var d0=draft;vidGet(key).then(function(b){if(draft===d0&&!d0.videoTouched&&b){d0.video=b;renderVid()}})}
}
/* guarda o rascunho de um dia novo enquanto a criança escreve */
var draftT;
function keepDraft(){
  if(!draft||draft.id)return;
  clearTimeout(draftT);
  draftT=setTimeout(function(){
    var ta=$('#txt');if(ta)draft.text=ta.value;
    var dt=$('#dt');if(dt&&dt.value)draft.date=dt.value;
    S.draft=(draft.text.trim()||draft.mood||draft.video)?{date:draft.date,text:draft.text,mood:draft.mood,character:draft.character,friends:draft.friends.slice(),video:!!draft.video}:null;
    save();
  },400);

  var d=new Date();if(!have[dstr(d)])d.setDate(d.getDate()-1);

/* ---------- Vídeos (ficam neste aparelho, no IndexedDB) ---------- */
var VDB=null;
function vdb(){return VDB||(VDB=new Promise(function(res,rej){
  if(!window.indexedDB){rej(new Error('sem idb'));return}
  var r=indexedDB.open('diario-videos',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('v')};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
}))}
function vtx(mode,fn){return vdb().then(function(db){return new Promise(function(res,rej){
  var t=db.transaction('v',mode),q=fn(t.objectStore('v'));
  t.oncomplete=function(){res(q&&q.result)};t.onerror=t.onabort=function(){rej(t.error)};
})})}
function vidGet(k){return vtx('readonly',function(s){return s.get(k)}).catch(function(){return null})}
function vidPut(k,b){return vtx('readwrite',function(s){s.put(b,k)})}
function vidDel(k){return vtx('readwrite',function(s){s.delete(k)}).catch(function(){})}
function vidExt(b){return b&&b.type&&b.type.indexOf('mp4')>-1?'mp4':'webm'}

var MAXV=60,cam={stream:null,rec:null,chunks:[],timer:null,t0:0,discard:false},vidState='idle',vidUrl=null;
function pickMime(){
  if(!window.MediaRecorder)return null;
  var c=['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp8,opus','video/webm'];
  for(var i=0;i<c.length;i++)if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c[i]))return c[i];
  return '';
}
function stopCam(){
  clearInterval(cam.timer);
  if(cam.rec&&cam.rec.state!=='inactive'){cam.discard=true;try{cam.rec.stop()}catch(e){}}
  cam.rec=null;
  if(cam.stream){cam.stream.getTracks().forEach(function(t){t.stop()});cam.stream=null}
  if(vidState!=='idle')vidState='idle';
}
function camErr(e){
  var n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return 'A câmera não foi liberada. Peça para um adulto liberar a câmera.';
  if(n==='NotFoundError'||n==='OverconstrainedError')return 'Não achei uma câmera neste aparelho.';
  if(n==='NotReadableError')return 'A câmera está sendo usada por outro app.';
  return 'Não consegui abrir a câmera agora.';
}
function openCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||pickMime()===null){toast('Este navegador não grava vídeo. Tente no Chrome ou no Safari.');return}
  stopRec();
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:true}).then(function(st){
    if(view!=='write'){st.getTracks().forEach(function(t){t.stop()});return}
    cam.stream=st;vidState='live';renderVid();
    var v=$('#live');if(v){v.srcObject=st;v.play().catch(function(){})}
  }).catch(function(e){toast(camErr(e))});
}
function startRecording(){
  if(!cam.stream)return;
  var mime=pickMime(),opts={videoBitsPerSecond:900000};if(mime)opts.mimeType=mime;
  try{cam.rec=new MediaRecorder(cam.stream,opts)}catch(e){try{cam.rec=new MediaRecorder(cam.stream)}catch(e2){toast('Não consegui gravar neste aparelho.');return}}
  cam.chunks=[];cam.discard=false;
  var r=cam.rec;
  r.ondataavailable=function(ev){if(ev.data&&ev.data.size)cam.chunks.push(ev.data)};
  r.onstop=function(){
    var chunks=cam.chunks;cam.chunks=[];
    if(cam.discard){cam.discard=false;return}
    if(cam.stream){cam.stream.getTracks().forEach(function(t){t.stop()});cam.stream=null}
    var blob=new Blob(chunks,{type:(r.mimeType||mime||'video/webm')});
    if(!blob.size){toast('O vídeo ficou vazio. Tente de novo!');vidState='idle';renderVid();return}
    draft.video=blob;draft.videoTouched=true;vidState='idle';
    if(!draft.id)vidPut('__draft',blob).catch(function(){});
    keepDraft();renderVid();pop('yay');toast('Vídeo pronto!');
  };
  r.start(1000);cam.t0=Date.now();vidState='rec';renderVid();
  var v=$('#live');if(v&&cam.stream){v.srcObject=cam.stream;v.play().catch(function(){})}
  cam.timer=setInterval(function(){
    var s=Math.floor((Date.now()-cam.t0)/1000),el=$('#recTime');
    if(el)el.textContent=Math.floor(s/60)+':'+z(s%60)+' de 1:00';
    var bar=$('#recBar');if(bar)bar.style.width=Math.min(100,s/MAXV*100)+'%';
    if(s>=MAXV)stopRecording();
  },250);
}
function stopRecording(){clearInterval(cam.timer);if(cam.rec&&cam.rec.state!=='inactive')cam.rec.stop();cam.rec=null}
function renderVid(){
  var box=$('#vidBox');if(!box||!draft)return;
  if(vidUrl){URL.revokeObjectURL(vidUrl);vidUrl=null}
  var CAMI='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10l6-3v10l-6-3z"/></svg>';
  if(vidState==='live'||vidState==='rec'){
    var recing=vidState==='rec';
    box.innerHTML='<div class="vidwrap live'+(recing?' recording':'')+'"><video id="live" muted playsinline autoplay></video>'+
      (recing?'<span class="recdot">GRAVANDO</span><div class="recprog"><span id="recBar"></span></div>':'<span class="tip">Sorria! Você pode gravar até 1 minuto.</span>')+'</div>'+
      '<div class="actions" style="margin-top:12px">'+(recing?'<button class="btn" data-act="vid-stop"><span class="sq" aria-hidden="true"></span>Parar <span id="recTime" class="rt">0:00 de 1:00</span></button>'
        :'<button class="btn" data-act="vid-rec"><span class="dot" aria-hidden="true"></span>Gravar</button><button class="btn ghost" data-act="vid-cancel">Fechar câmera</button>')+'</div>';
    return;
  }
  if(draft.video){
    vidUrl=URL.createObjectURL(draft.video);
    box.innerHTML='<div class="vidwrap"><video src="'+vidUrl+'" controls playsinline preload="metadata"></video></div>'+
      '<div class="actions" style="margin-top:12px"><button class="btn ghost small" data-act="vid-open">Gravar outro</button><button class="btn ghost small" data-act="vid-remove">Tirar o vídeo</button></div>';
    return;
  }
  box.innerHTML='<button class="bigcam" data-act="vid-open">'+'<span class="ic">'+CAMI+'</span><span><strong>Gravar um vídeo</strong><br><small>Conte seu dia olhando para a câmera</small></span></button>';
}
var dayVid={id:null,file:null,url:null};
function loadDayVideo(id){
  if(dayVid.url){URL.revokeObjectURL(dayVid.url);dayVid.url=null}
  dayVid.id=id;dayVid.file=null;
  var e=entry(id);if(!e||!e.hasVideo)return;
  vidGet(id).then(function(b){
    var box=$('#dayVid');if(!box||dayVid.id!==id)return;
    if(!b){box.innerHTML='<div class="empty" style="padding:14px">O vídeo deste dia não está neste aparelho.</div>';var sb=$('#shareVid');if(sb)sb.remove();return}
    dayVid.file=new File([b],'meu-dia-'+e.date+'.'+vidExt(b),{type:(b.type||'video/webm').split(';')[0]});
    dayVid.url=URL.createObjectURL(b);
    box.innerHTML='<video src="'+dayVid.url+'" controls playsinline preload="metadata"></video>';
  });
}
function downloadFile(f){
  var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function shareVideo(id){
  var e=entry(id),f=dayVid.file;
  if(!e||!f||dayVid.id!==id){toast('O vídeo ainda está carregando. Tente de novo!');return}
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:'Meu dia',text:shareText(e)}).catch(function(err){if(err&&err.name!=='AbortError'){downloadFile(f);toast('Baixei o vídeo. Agora é só enviar pelo WhatsApp.')}});
  }else{downloadFile(f);toast('Baixei o vídeo. Agora é só enviar pelo WhatsApp.')}
}

/* ---------- Sons e festa ---------- */
var AC=null;
function pop(kind){
  if(S.settings.sound===false)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var notes=kind==='yay'?[523,659,784,1047]:kind==='tap'?[660]:kind==='night'?[784,659,523,392]:kind==='boing'?[300,450,600]:[392];
    notes.forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.09;
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='tap'?.06:.12,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.22);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25);
    });
  }catch(e){}
}
var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){
  if(reduceMotion)return;
  var box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');
  var cols=['#ffd43b','#ff6b6b','#4dabf7','#7fcf6b','#b197fc','#ff922b'];
  for(var i=0;i<46;i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*.35)+'s';p.style.animationDuration=(1.4+Math.random()*1.2)+'s';
    p.style.setProperty('--dx',(Math.random()*120-60)+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');
    if(i%3===0)p.style.borderRadius='50%';
    box.appendChild(p);
  }
  $('#app').appendChild(box);setTimeout(function(){box.remove()},3200);
}

function btnBusy(b,txt){if(b){b.disabled=true;b.textContent=txt}}
function celebrate(e,isNew){
  if(!isNew){toast('Pronto, mudei o seu dia!');go('day',e.id);return}
  go('yay',e.id);confetti();pop('yay');
}
VIEWS.yay=function(id){
  var e=entry(id);if(!e)return VIEWS.days();
  var stars=S.entries.filter(function(x){return !x.deletedAt&&!x.example}).length,st=streak();
  var cheer=['Muito bem!','Que legal!','Arrasou!','Incrível!','Show de bola!'][stars%5];
  return '<div class="yay"><div class="yaychar">'+charSvg(e.character||'coelha',150)+'</div>'+
    '<h2>'+cheer+'</h2><p class="yaysub">Seu dia foi guardado no diário.</p>'+
    '<div class="yaystar">'+STAR.replace(/26/g,'44')+'<span>+1 estrela<br><small>Você tem '+stars+(stars===1?' estrela':' estrelas')+'</small></span></div>'+
    (st>1?'<p class="yaystreak">'+st+' dias seguidos escrevendo!</p>':'')+
    '<div class="actions" style="justify-content:center"><button class="btn big" data-act="go" data-v="day" data-id="'+e.id+'">Ver meu dia</button><button class="btn ghost" data-act="go" data-v="park">Voltar ao quarto</button></div></div>';
};

/* ---------- Cópia de segurança ---------- */
function backup(){
  try{
    var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='meu-diario-'+dstr()+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
    S.settings.lastBackup=dstr();save();toast('Cópia baixada! Guarde o arquivo em um lugar seguro.');render();
  }catch(e){toast('Não consegui baixar a cópia neste aparelho.')}
}
function restoreBackup(file){
  var r=new FileReader();
  r.onload=function(){
    var o;try{o=JSON.parse(r.result)}catch(e){o=null}
    if(!o||!Array.isArray(o.entries)||!Array.isArray(o.friends)||!Array.isArray(o.reminders)||!o.settings){toast('Esse arquivo não é uma cópia do diário.');return}
    var n=o.entries.filter(function(e){return !e.deletedAt}).length;
    if(!confirm('Trocar o diário deste aparelho pela cópia com '+n+(n===1?' dia':' dias')+'? O que está aqui agora será substituído.'))return;
    S=o;save();applyRoom();toast('Cópia restaurada!');render();
  };
  r.onerror=function(){toast('Não consegui ler esse arquivo.')};
  r.readAsText(file);
}

/* ---------- Ações ---------- */
function restore(id){
  var e=entry(id);if(!e)return;
  e.deletedAt=null;save();selTrash=null;toast('Pronto! O dia voltou para o diário.');render();
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='go'){go(el.dataset.v,id);return}
  if(a==='mood'){draft.mood=el.dataset.mood;$$('.mood').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mood===draft.mood))});var bb=$('#bubble');if(bb){bb.textContent=bubbleText();bb.classList.remove('pop');void bb.offsetWidth;bb.classList.add('pop')}pop('tap');keepDraft();return}
  if(a==='char'){draft.character=draft.character===el.dataset.char?null:el.dataset.char;$$('.char').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.char===draft.character))});var bp=$('#buddyPic');if(bp)bp.innerHTML=charSvg(draft.character||'coelha',72);pop('tap');keepDraft();return}
  if(a==='idea'){
    var tx=$('#txt'),t0=el.dataset.t+' ';
    tx.value=tx.value.trim()?tx.value.replace(/\s*$/,'')+'\n'+t0:t0;
    tx.focus();try{tx.setSelectionRange(tx.value.length,tx.value.length)}catch(e){}
    draft.text=tx.value;keepDraft();return;
  }
  if(a==='ideas-more'){$('#ideas').innerHTML=ideaChips();return}
  if(a==='vid-open'){openCam();return}
  if(a==='vid-rec'){startRecording();return}
  if(a==='vid-stop'){stopRecording();return}
  if(a==='vid-cancel'){stopCam();renderVid();return}
  if(a==='vid-remove'){draft.video=null;draft.videoTouched=true;if(!draft.id)vidDel('__draft');keepDraft();renderVid();return}
  if(a==='share-vid'){shareVideo(id);return}
  if(a==='decor-open'){openDecor();return}
  if(a==='decor-close'){closeDecor();return}
  if(a==='room'){room()[el.dataset.k]=el.dataset.v;save();applyRoom();renderDecor();pop('tap');return}
  if(a==='room-night'){if(!!room().night!==(el.dataset.v==='1'))toggleNight();return}
  if(a==='sound'){S.settings.sound=S.settings.sound===false;save();render();if(S.settings.sound!==false)pop('yay');return}
  if(a==='fpick'){var i=draft.friends.indexOf(id);if(i>-1)draft.friends.splice(i,1);else draft.friends.push(id);el.setAttribute('aria-pressed',String(i===-1));keepDraft();return}
  if(a==='clear-draft'){S.draft=null;save();initDraft();render();return}
  if(a==='cal-prev'||a==='cal-next'){calMonth=shiftMonth(calMonth,a==='cal-prev'?-1:1);render();return}
  if(a==='cal-day'){
    var dd0=el.dataset.date;
    if(el.dataset.has==='1'){filt.date=filt.date===dd0?'':dd0;render();var lh=$('#listHead');if(lh&&filt.date)lh.scrollIntoView({behavior:'smooth',block:'start'})}
    else go('write','d:'+dd0);
    return;
  }
  if(a==='fdate'){filt.date='';render();return}
  if(a==='backup'){backup();return}
  if(a==='restore-file'){var fi=$('#bkfile');if(fi)fi.click();return}
  if(a==='clear-examples'){
    if(!confirm('Tirar os dias e lembretes de exemplo?'))return;
    S.entries=S.entries.filter(function(e){return !e.example});S.reminders=S.reminders.filter(function(r){return !r.example});
    save();toast('Exemplos tirados.');render();return;
  }
  if(a==='empty-trash'){
    if(!confirm('Apagar para sempre os dias da lixeira? Não dá para desfazer.'))return;
    S.entries.forEach(function(e){if(e.deletedAt&&e.hasVideo)vidDel(e.id)});
    S.entries=S.entries.filter(function(e){return !e.deletedAt});save();toast('Lixeira esvaziada.');render();return;
  }
  if(a==='enter'){
    var nm=$('#nm').value.trim();
    if(!nm){toast('Escreva o seu nome para entrar.');$('#nm').focus();return}
    S.settings.name=nm;save();go('park');toast('Oi, '+nm+'! Bem-vindo ao seu quarto.');return
  }
  if(a==='mic'){dictate();return}
  if(a==='save-entry'){
    var ta=$('#txt');draft.text=ta.value.trim();draft.date=$('#dt').value||dstr();
    if(!draft.mood){toast('Escolha uma carinha: como você está?');return}
    if(vidState==='rec'){toast('Termine de gravar o vídeo primeiro.');return}
    if(!draft.text&&!draft.video){toast('Escreva, fale ou grave um vídeo sobre o seu dia.');return}
    stopRec();stopCam();
    var isNew=!draft.id,e=draft.id&&entry(draft.id);
    if(e){e.date=draft.date;e.text=draft.text;e.mood=draft.mood;e.character=draft.character;e.friends=draft.friends.slice();e.example=false}
    else{e={id:uid(),date:draft.date,text:draft.text,mood:draft.mood,character:draft.character,friends:draft.friends.slice(),createdAt:Date.now(),deletedAt:null};S.entries.push(e);S.draft=null;clearTimeout(draftT)}
    var vop=Promise.resolve(),vidChanged=draft.videoTouched||(isNew&&draft.video);
    if(vidChanged){
      vop=draft.video?vidPut(e.id,draft.video):vidDel(e.id);
      if(draft.video&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
    }
    var hadVideo=!!draft.video;
    btnBusy(el,'Guardando...');
    vop.then(function(){
      if(vidChanged)e.hasVideo=hadVideo;
      if(isNew)vidDel('__draft');
      save();celebrate(e,isNew);
    }).catch(function(){
      if(vidChanged)e.hasVideo=false;
      if(!e.text)e.text='(vídeo)';
      save();toast('O vídeo não coube no aparelho, mas o resto foi guardado.');go('day',e.id);
    });
    return;
  }
  if(a==='fmood'){filt.mood=el.dataset.mood;render();return}
  if(a==='ffriend'){filt.friend=id;render();return}
  if(a==='del-entry'){var d=entry(id);if(d){d.deletedAt=Date.now();save();toast('Apagado. Fica na lixeira por '+TRASH_DAYS+' dias.');go('days')}return}
  if(a==='sel-trash'){selTrash=id;render();return}
  if(a==='mic-restore'){if(selTrash)listenRestore(selTrash);return}
  if(a==='restore-btn'){if(selTrash)restore(selTrash);return}
  if(a==='add-rem'){
    var t=$('#rt').value.trim(),dd=$('#rd').value;
    if(!t){toast('Diga o que vai acontecer.');return}
    if(!dd){toast('Escolha o dia.');return}
    S.reminders.push({id:uid(),title:t,date:dd});save();toast('Lembrete guardado!');render();return
  }
  if(a==='del-rem'){S.reminders=S.reminders.filter(function(r){return r.id!==id});save();render();return}
  if(a==='add-friend'){
    var n=$('#fn').value.trim();if(!n){toast('Escreva o nome do amigo.');return}
    S.friends.push({id:uid(),name:n});save();toast('Amigo adicionado!');render();return
  }
  if(a==='del-friend'){S.friends=S.friends.filter(function(f){return f.id!==id});S.entries.forEach(function(e){e.friends=(e.friends||[]).filter(function(x){return x!==id})});if(filt.friend===id)filt.friend='';save();render();return}
  if(a==='gate'){var v=parseInt($('#ans').value,10);if(v===gate.a+gate.b){momOK=true;render()}else{gate=null;toast('Ops, essa não é a resposta.');render()}return}
  if(a==='save-mom'){S.settings.name=$('#cn').value.trim();S.settings.momPhone=$('#mp').value.trim();save();toast('Guardado!');go(S.settings.name?'park':'welcome');return}
});
document.addEventListener('input',function(ev){
  if(view==='write'&&(ev.target.id==='txt'||ev.target.id==='dt'))keepDraft();
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='bkfile'&&ev.target.files&&ev.target.files[0])restoreBackup(ev.target.files[0]);
});
$$('.hot').forEach(function(h){
  try{
    var bb=h.getBBox(),hit=document.createElementNS('http://www.w3.org/2000/svg','rect');
    hit.setAttribute('x',bb.x-6);hit.setAttribute('y',bb.y-6);hit.setAttribute('width',bb.width+12);hit.setAttribute('height',bb.height+12);
    hit.setAttribute('fill','transparent');h.insertBefore(hit,h.firstChild);
  }catch(e){}
  var open=function(){
    if(h.dataset.play==='night'){toggleNight();return}
    if(decorOpen)return;
    go(h.dataset.go);
  };
  h.addEventListener('click',open);
  h.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open()}});
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&view==='welcome'&&ev.target.id==='nm'){ev.preventDefault();var b=$('[data-act=enter]');if(b)b.click();return}
  if(ev.key==='Escape'&&decorOpen){closeDecor();return}
  if(ev.key==='Escape'&&view!=='park'&&view!=='welcome')go('park');
});
(function(){var bl=$('#ball'),play=function(){bl.classList.remove('bounce');void bl.getBoundingClientRect();bl.classList.add('bounce');pop('boing')};
  bl.addEventListener('click',play);bl.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();play()}});})();
applyRoom();
updatePark();
if(!S.settings.name)go('welcome');
/* funciona sem internet depois da primeira visita */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
