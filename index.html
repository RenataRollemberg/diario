<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Meu Diário do Parque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b3a5a;
  --ink-soft:#56648a;
  --sky:#8fd3ff;
  --grass:#7fcf6b;
  --paper:#f3f9ff;
  --card:#ffffff;
  --line:#d3e3f5;
  --coral:#d9432f;
  --coral-soft:#ffe2dc;
  --sun:#ffd43b;
  --mint:#dff6e3;
  --radius:20px;
  --display:'Baloo 2','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:#dff4ff;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #5c7cfa;outline-offset:2px}

#app{position:relative;height:100%;overflow:hidden;background:linear-gradient(#8fd3ff 0 40%,#7fcf6b 40%)}

/* ---------- Parque ---------- */
#park{position:absolute;inset:0}
#parkSvg{width:100%;height:100%;display:block;overflow:visible}
.hot{cursor:pointer;outline:none}
.hot .lift{transition:transform .18s ease;transform-box:fill-box;transform-origin:center bottom}
.hot:hover .lift,.hot:focus-visible .lift{transform:scale(1.06)}
.hot:focus-visible .pill rect{stroke:#5c7cfa;stroke-width:4}
.pill text{font-family:var(--display);font-weight:700;font-size:15px;fill:#fff;text-anchor:middle}
.pill rect{fill:var(--ink)}
.cloud{animation:drift 60s linear infinite alternate}
.cloud.b{animation-duration:80s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
.sway{animation:sway 3.2s ease-in-out infinite alternate;transform-box:view-box}
@keyframes sway{from{transform:rotate(7deg)}to{transform:rotate(-7deg)}}
@media (prefers-reduced-motion:reduce){.cloud,.sway{animation:none}.hot .lift{transition:none}}

.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.top h1{margin:0;font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.1;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.7)}
.top p{margin:0;font-weight:700;color:var(--ink);opacity:.85}
.gear{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 rgba(43,58,90,.18);display:grid;place-items:center}

/* ---------- Painéis ---------- */
#sheet{position:absolute;inset:0;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
.bar{position:sticky;top:0;z-index:2;background:var(--paper);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--line)}
.bar h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1}
.back{border:0;background:var(--sky);color:var(--ink);font-weight:800;border-radius:999px;min-height:48px;padding:0 18px 0 14px;display:flex;align-items:center;gap:6px;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 48px)}
.wrap h3{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:22px 0 10px}
.wrap h3:first-child{margin-top:0}
.hint{color:var(--ink-soft);font-size:.95rem;margin:4px 0 0}

.btn{border:0;border-radius:999px;min-height:56px;padding:0 26px;font-family:var(--display);font-weight:700;font-size:1.2rem;background:var(--coral);color:#fff;box-shadow:0 4px 0 #9d2b1c;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9d2b1c}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.green{background:#1f8a4c;box-shadow:0 4px 0 #14653a}
.btn.small{min-height:44px;font-size:1rem;padding:0 18px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn[disabled]{opacity:.45;pointer-events:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

textarea,input[type=text],input[type=date],input[type=tel],input[type=number],select{width:100%;border:3px solid var(--line);border-radius:16px;background:#fff;padding:12px 14px;min-height:52px}
textarea{min-height:170px;resize:vertical;line-height:1.5}
label.f{display:block;font-weight:800;margin:14px 0 6px}

.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.moods{grid-template-columns:repeat(6,1fr)}}
.mood{border:3px solid var(--line);background:#fff;border-radius:var(--radius);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.95rem}
.mood[aria-pressed=true]{border-color:var(--ink);background:#fff6c9;box-shadow:0 4px 0 var(--ink)}

.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.chars{grid-template-columns:repeat(6,1fr)}}
.char{border:3px solid var(--line);background:#fff;border-radius:var(--radius);padding:6px 4px;font-weight:800;font-size:.9rem;display:flex;flex-direction:column;align-items:center}
.char[aria-pressed=true]{border-color:var(--ink);background:var(--mint);box-shadow:0 4px 0 var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--line);background:#fff;border-radius:999px;min-height:46px;padding:0 16px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{border-color:var(--ink);background:#fff6c9}
.chip .x{opacity:.6}

.mic{display:flex;align-items:center;gap:12px;margin-top:10px}
.micbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #9d2b1c;flex:none}
.micbtn[aria-pressed=true]{background:#1f8a4c;box-shadow:0 4px 0 #14653a;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.micbtn[aria-pressed=true]{animation:none}}

.card{background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.list{display:grid;gap:12px}
.row{border:3px solid var(--line);background:#fff;border-radius:var(--radius);padding:10px 14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.row .meta{min-width:0;flex:1}
.row .d{font-weight:800}
.row .s{color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row[aria-pressed=true]{border-color:var(--ink);background:#fff6c9;box-shadow:0 4px 0 var(--ink)}
.tag{display:inline-block;font-size:.78rem;font-weight:800;background:#e8eefb;color:var(--ink-soft);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle}
.tag.warn{background:var(--coral-soft);color:#8f2a1b}
.empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-weight:700}
.dayhead{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.dayhead h3{margin:0}
.diarytext{white-space:pre-wrap;font-size:1.2rem;line-height:1.6;background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline>*{flex:1 1 180px}
.inline>.btn{flex:0 0 auto}
.linkbtn{background:none;border:0;color:var(--ink-soft);text-decoration:underline;font-weight:700;padding:10px 4px;min-height:44px}

.welcome{min-height:100%;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background:linear-gradient(#8fd3ff 0 46%,#7fcf6b 46%)}
.welcome h1{margin:0;font-family:var(--display);font-weight:800;font-size:2.8rem;line-height:1.05;text-shadow:0 3px 0 rgba(255,255,255,.7)}
.welcome .crew{display:flex;gap:6px;align-items:flex-end;justify-content:center;margin:6px 0 10px}
.welcome .box{background:#fff;border:3px solid var(--line);border-radius:28px;padding:20px 20px 22px;width:min(100%,420px);box-shadow:0 6px 0 rgba(43,58,90,.14)}
.welcome .box label{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;margin-bottom:10px}
.welcome .box input{text-align:center;font-size:1.4rem;font-weight:800}
.welcome .box .btn{width:100%;margin-top:16px}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;font-weight:800;border-radius:999px;padding:12px 22px;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var DAY=86400000, KEY='diario-parque-v1', TRASH_DAYS=30;
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
function z(n){return String(n).padStart(2,'0')}
function dstr(d){d=d||new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return dstr(d)}
function longDate(s){return cap(pd(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))}
function shortDate(s){return pd(s).toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','')}
function daysUntil(s){return Math.round((pd(s)-pd(dstr()))/DAY)}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36)}

/* ---------- Carinhas de humor ---------- */
var MOODS=[
 {id:'feliz',label:'Feliz',bg:'#ffd93d'},
 {id:'animado',label:'Animado',bg:'#ffb347'},
 {id:'calmo',label:'Calmo',bg:'#8fe0c9'},
 {id:'medo',label:'Com medo',bg:'#b9a7ff'},
 {id:'triste',label:'Triste',bg:'#7fb8ff'},
 {id:'bravo',label:'Bravo',bg:'#ff8a7a'}
];
function moodOf(id){for(var i=0;i<MOODS.length;i++)if(MOODS[i].id===id)return MOODS[i];return null}
var FEATS={

var toastT;

/* ---------- Voz ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null;
function stopRec(){if(rec){try{rec.onend=null;rec.onerror=null;rec.abort()}catch(e){}rec=null}var m=$('#mic');if(m)m.setAttribute('aria-pressed','false');var lab=$('#micLabel');if(lab)lab.textContent='Toque para falar'}
function voiceErr(code){
  if(code==='not-allowed'||code==='service-not-allowed')return 'O microfone não foi liberado neste aparelho. Peça ajuda para liberar.';
  if(code==='no-speech')return 'Não ouvi nada. Tente de novo!';
  if(code==='network')return 'A voz precisa de internet. Tente de novo mais tarde.';
  return 'A voz não funcionou agora. Você pode escrever!';
}
function dictate(){
  var btn=$('#mic');
  if(!SR){toast('A voz não funciona neste navegador. Você pode escrever!');return}
  if(rec){stopRec();return}
  rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=false;
  rec.onresult=function(ev){
    var ta=$('#txt');if(!ta)return;
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal){
        var t=ev.results[i][0].transcript.trim();
        if(t){ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+(ta.value&&!/[.!?]\s*$/.test(ta.value)?t:cap(t));draft.text=ta.value}
      }
    }
  };
  rec.onerror=function(ev){stopRec();toast(voiceErr(ev.error))};
  rec.onend=function(){stopRec()};
  try{rec.start();btn.setAttribute('aria-pressed','true');$('#micLabel').textContent='Estou ouvindo... toque para parar'}catch(e){stopRec();toast('A voz não funcionou agora. Você pode escrever!')}
}
function listenRestore(id){
  if(!SR){restore(id);return}
  if(rec){stopRec();return}
  rec=new SR();rec.lang='pt-BR';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=4;
  rec.onresult=function(ev){
    var heard='';
    for(var i=0;i<ev.results.length;i++)for(var j=0;j<ev.results[i].length;j++)heard+=' '+ev.results[i][j].transcript;
    stopRec();
    if(/volt|restaur|traz|recuper|devolv/i.test(heard))restore(id);
    else toast('Não entendi. Diga: voltar');
  };
  rec.onerror=function(ev){stopRec();toast(voiceErr(ev.error))};
  rec.onend=function(){stopRec()};
  try{rec.start();var b=$('#micR');if(b)b.setAttribute('aria-pressed','true');var l=$('#micRLabel');if(l)l.textContent='Estou ouvindo... diga: voltar'}catch(e){stopRec();toast('A voz não funcionou agora.')}
}

function render(){

}

function updatePark(){

   '<button class="btn ghost" data-act="go" data-v="write" data-id="'+e.id+'">Mudar</button>'+
   '<button class="btn ghost" data-act="del-entry" data-id="'+e.id+'">Apagar este dia</button></div>'+
   (hasPhone?'':'<p class="hint">A mamãe ainda não cadastrou o número dela. Toque na engrenagem, no parque, para cadastrar. Por enquanto o WhatsApp vai pedir para escolher quem recebe.</p>')+
   '</div>';
};

VIEWS.reminders=function(){
  var up=upcoming(),past=S.reminders.filter(function(r){return daysUntil(r.date)<0}).sort(function(a,b){return a.date<b.date?1:-1});
  function row(r){
    var n=daysUntil(r.date),when=n===0?'É hoje!':n===1?'É amanhã':n>1?'Faltam '+n+' dias':'Já passou';
    return '<div class="row" style="cursor:default"><span class="meta"><span class="d">'+esc(r.title)+(r.example?'<span class="tag">exemplo</span>':'')+'</span><br><span class="s">'+esc(longDate(r.date))+' · <strong>'+when+'</strong></span></span><button class="btn ghost small" data-act="del-rem" data-id="'+r.id+'" aria-label="Tirar lembrete '+esc(r.title)+'">Tirar</button></div>';
  }
  return head('Lembretes')+'<div class="wrap">'+
   '<h3>Datas importantes</h3>'+(up.length?'<div class="list">'+up.map(row).join('')+'</div>':'<div class="empty">Nenhuma data por perto.</div>')+
   (past.length?'<h3>Já passaram</h3><div class="list">'+past.map(row).join('')+'</div>':'')+
   '<h3>Novo lembrete</h3><div class="card"><label class="f" for="rt" style="margin-top:0">O que vai acontecer?</label><input type="text" id="rt" maxlength="40" placeholder="Ex.: festa da Ana">'+
   '<label class="f" for="rd">Que dia?</label><input type="date" id="rd" value="'+addDays(1)+'">'+
   '<div class="actions" style="margin-top:16px"><button class="btn" data-act="add-rem">Guardar lembrete</button></div></div>'+
   '<p class="hint" style="margin-top:14px">Os lembretes aparecem aqui e na placa do parque.</p></div>';
};

VIEWS.friends=function(){
  var rows=S.friends.length?S.friends.map(function(f){return '<span class="chip">'+esc(f.name)+' <button class="linkbtn x" style="padding:0 0 0 6px;min-height:0;text-decoration:none;font-size:1.3rem" data-act="del-friend" data-id="'+f.id+'" aria-label="Tirar '+esc(f.name)+'">×</button></span>'}).join(''):'<div class="empty">Ainda não tem amigos por aqui.</div>';
  return head('Meus amigos')+'<div class="wrap"><h3>Amigos do diário</h3><div class="chips">'+rows+'</div>'+
   '<h3>Novo amigo ou amiga</h3><div class="inline"><div><label class="f" for="fn" style="margin-top:0">Nome</label><input type="text" id="fn" maxlength="30" placeholder="Ex.: Lia"></div><button class="btn" data-act="add-friend">Adicionar</button></div>'+
   '<p class="hint" style="margin-top:14px">Quando você escrever um dia, é só tocar no nome de quem estava com você.</p></div>';
};

function daysLeft(e){return Math.max(0,TRASH_DAYS-Math.floor((Date.now()-e.deletedAt)/DAY))}
VIEWS.trash=function(){
  var list=S.entries.filter(function(e){return e.deletedAt}).sort(function(a,b){return b.deletedAt-a.deletedAt});
  var rows=list.length?list.map(function(e){
    var d=daysLeft(e);
    return '<button class="row" data-act="sel-trash" data-id="'+e.id+'" aria-pressed="'+(selTrash===e.id)+'">'+face(e.mood,48)+'<span class="meta"><span class="d">'+esc(longDate(e.date))+(e.example?'<span class="tag">exemplo</span>':'')+'</span><br><span class="s">'+esc(e.text)+'</span><span class="tag warn" style="margin:4px 0 0">Some de vez em '+d+(d===1?' dia':' dias')+'</span></span></button>';
  }).join(''):'<div class="empty">A lixeira está vazia.</div>';
  var sel=selTrash&&entry(selTrash);
  var micBlock='';
  if(list.length){
    micBlock='<h3>Trazer de volta</h3><p class="hint" style="margin:0 0 8px">'+(sel?'Toque no microfone e diga <strong>“voltar”</strong>.':'Toque em um dia da lista.')+'</p>'+
      '<div class="mic"><button class="micbtn" id="micR" data-act="mic-restore" aria-pressed="false" aria-label="Falar voltar" '+(sel?'':'disabled style="opacity:.4"')+'><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><strong id="micRLabel">'+(SR?'Diga: voltar':'A voz não funciona aqui')+'</strong></div>'+
      '<button class="linkbtn" data-act="restore-btn" '+(sel?'':'disabled')+'>A voz não funcionou? Toque aqui para trazer de volta</button>';
  }
  return head('Lixeira')+'<div class="wrap"><p class="hint" style="margin:0 0 14px">Os dias apagados ficam guardados por '+TRASH_DAYS+' dias. Depois somem para sempre.</p><div class="list">'+rows+'</div>'+micBlock+'</div>';
};

VIEWS.welcome=function(){
  return '<div class="welcome"><h1>Meu Diário</h1><div class="crew">'+charSvg('coelha',84)+charSvg('ursinho',104)+charSvg('pintinho',84)+'</div>'+
   '<div class="box"><label for="nm">Qual é o seu nome?</label><input type="text" id="nm" maxlength="24" autocomplete="off" autocapitalize="words" placeholder="Escreva aqui" value="'+esc(S.settings.name)+'"><button class="btn" data-act="enter">Entrar no parque</button></div></div>';
};

VIEWS.mom=function(){
  if(!momOK){
    if(!gate){var a=6+Math.floor(Math.random()*4),b=4+Math.floor(Math.random()*5);gate={a:a,b:b}}
    return head('Área da mamãe')+'<div class="wrap"><div class="card"><h3>Só para adultos</h3><p style="margin-top:0">Quanto é <strong>'+gate.a+' + '+gate.b+'</strong>?</p><input type="number" id="ans" inputmode="numeric" aria-label="Resposta"><div class="actions" style="margin-top:14px"><button class="btn" data-act="gate">Entrar</button></div></div></div>';
  }
  return head('Área da mamãe')+'<div class="wrap">'+
   '<h3>Sobre a criança</h3><label class="f" for="cn" style="margin-top:0">Nome no diário</label><input type="text" id="cn" maxlength="24" value="'+esc(S.settings.name)+'" placeholder="Como devemos chamar?">'+
   '<h3>WhatsApp da mamãe</h3><label class="f" for="mp" style="margin-top:0">Número com país e DDD</label><input type="tel" id="mp" inputmode="tel" value="'+esc(S.settings.momPhone)+'" placeholder="5511999998888">'+
   '<p class="hint">Quando a criança tocar em “Compartilhar com a mamãe”, o WhatsApp abre com o texto do dia pronto para enviar. Nada é enviado sozinho.</p>'+
   '<h3>Onde os dias ficam guardados</h3><div class="card"><strong>Neste aparelho (teste).</strong><p class="hint" style="margin:6px 0 0">A conta do Google Drive ainda será escolhida. Enquanto isso, o diário fica salvo só neste navegador.</p></div>'+
   '<div class="actions"><button class="btn" data-act="save-mom">Guardar</button></div></div>';
};

/* ---------- Ações ---------- */
function restore(id){
  var e=entry(id);if(!e)return;
  e.deletedAt=null;save();selTrash=null;toast('Pronto! O dia voltou para o diário.');render();
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='go'){go(el.dataset.v,id);return}
  if(a==='mood'){draft.mood=el.dataset.mood;$$('.mood').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mood===draft.mood))});return}
  if(a==='char'){draft.character=draft.character===el.dataset.char?null:el.dataset.char;$$('.char').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.char===draft.character))});return}
  if(a==='fpick'){var i=draft.friends.indexOf(id);if(i>-1)draft.friends.splice(i,1);else draft.friends.push(id);el.setAttribute('aria-pressed',String(i===-1));return}
  if(a==='enter'){
    var nm=$('#nm').value.trim();
    if(!nm){toast('Escreva o seu nome para entrar.');$('#nm').focus();return}
    S.settings.name=nm;save();go('park');toast('Oi, '+nm+'! Bem-vindo ao parque.');return
  }
  if(a==='mic'){dictate();return}
  if(a==='save-entry'){
    var ta=$('#txt');draft.text=ta.value.trim();draft.date=$('#dt').value||dstr();
    if(!draft.mood){toast('Escolha uma carinha: como você está?');return}
    if(!draft.text){toast('Escreva ou fale um pouquinho sobre o seu dia.');return}
    stopRec();
    var e=draft.id&&entry(draft.id);
    if(e){e.date=draft.date;e.text=draft.text;e.mood=draft.mood;e.character=draft.character;e.friends=draft.friends.slice();e.example=false}
    else{e={id:uid(),date:draft.date,text:draft.text,mood:draft.mood,character:draft.character,friends:draft.friends.slice(),createdAt:Date.now(),deletedAt:null};S.entries.push(e)}
    save();toast('Dia guardado no diário!');go('day',e.id);return
  }
  if(a==='fmood'){filt.mood=el.dataset.mood;render();return}
  if(a==='ffriend'){filt.friend=id;render();return}
  if(a==='del-entry'){var d=entry(id);if(d){d.deletedAt=Date.now();save();toast('Apagado. Fica na lixeira por '+TRASH_DAYS+' dias.');go('days')}return}
  if(a==='sel-trash'){selTrash=id;render();return}
  if(a==='mic-restore'){if(selTrash)listenRestore(selTrash);return}
  if(a==='restore-btn'){if(selTrash)restore(selTrash);return}
  if(a==='add-rem'){
    var t=$('#rt').value.trim(),dd=$('#rd').value;
    if(!t){toast('Diga o que vai acontecer.');return}
    if(!dd){toast('Escolha o dia.');return}
    S.reminders.push({id:uid(),title:t,date:dd});save();toast('Lembrete guardado!');render();return
  }
  if(a==='del-rem'){S.reminders=S.reminders.filter(function(r){return r.id!==id});save();render();return}
  if(a==='add-friend'){
    var n=$('#fn').value.trim();if(!n){toast('Escreva o nome do amigo.');return}
    S.friends.push({id:uid(),name:n});save();toast('Amigo adicionado!');render();return
  }
  if(a==='del-friend'){S.friends=S.friends.filter(function(f){return f.id!==id});S.entries.forEach(function(e){e.friends=(e.friends||[]).filter(function(x){return x!==id})});if(filt.friend===id)filt.friend='';save();render();return}
  if(a==='gate'){var v=parseInt($('#ans').value,10);if(v===gate.a+gate.b){momOK=true;render()}else{gate=null;toast('Ops, essa não é a resposta.');render()}return}
  if(a==='save-mom'){S.settings.name=$('#cn').value.trim();S.settings.momPhone=$('#mp').value.trim();save();toast('Guardado!');go(S.settings.name?'park':'welcome');return}
});
$$('.hot').forEach(function(h){
  try{
    var bb=h.getBBox(),hit=document.createElementNS('http://www.w3.org/2000/svg','rect');
    hit.setAttribute('x',bb.x-6);hit.setAttribute('y',bb.y-6);hit.setAttribute('width',bb.width+12);hit.setAttribute('height',bb.height+12);
    hit.setAttribute('fill','transparent');h.insertBefore(hit,h.firstChild);
  }catch(e){}
  var open=function(){go(h.dataset.go)};
  h.addEventListener('click',open);
  h.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open()}});
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&view==='welcome'&&ev.target.id==='nm'){ev.preventDefault();var b=$('[data-act=enter]');if(b)b.click();return}
  if(ev.key==='Escape'&&view!=='park'&&view!=='welcome')go('park');
});
updatePark();
if(!S.settings.name)go('welcome');
})();
</script>
</body></html>
